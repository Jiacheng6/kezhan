<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="../src/ui/dialogs.css"><title>课栈</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f1;color:#28332d;font:14px/1.8 'Segoe UI','Microsoft YaHei UI',sans-serif;display:grid;place-items:center;min-height:100vh}main{width:min(600px,90vw);padding:42px;border:1px solid #dedfd5;background:#fffefa}.brand{display:flex;align-items:center;gap:13px}.mark{display:block;width:36px;height:36px}.mark img{display:block;width:100%;height:100%}.mark i{width:6px;height:27px;background:#af4c35;border-radius:1px}.mark i:nth-child(2){height:23px}.mark i:nth-child(3){height:29px;transform:rotate(16deg);margin-left:2px}h1{font-size:18px;margin:0}.eyebrow{margin-top:27px;font-size:11px;letter-spacing:1px;color:#636f60}h2{font:29px/1.5 'STZhongsong','SimSun',serif;margin:10px 0 17px}p{color:#59645c;line-height:1.9;font-size:13px}button{border:1px solid #dedfd5;border-radius:6px;background:transparent;color:#28332d;padding:9px 17px;cursor:pointer;margin:12px 8px 0 0;font:13px 'Segoe UI','Microsoft YaHei UI',sans-serif}button:first-of-type{background:#af4c35;color:#fffefa;border-color:#af4c35}button:focus-visible{outline:2px solid #af4c35;outline-offset:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#aa4038;max-height:220px;overflow:auto;font-size:12px;background:#faeee8;padding:13px;border-radius:5px}pre:empty{display:none}
</style></head><body><main><div class="brand"><span class="mark" aria-hidden="true"><img src="assets/icon.svg" alt="" width="36" height="36"></span><h1>课栈</h1></div><p class="eyebrow">你的学习空间</p><h2>正在准备，稍候片刻。</h2><p id="message">正在启动服务与专用浏览器，请稍候…</p><pre id="error" role="alert"></pre><button id="retry">重新启动</button><button id="folder">打开数据文件夹</button></main><script src="../src/ui/close-dialog.js"></script><script src="loading.js"></script></body></html>
